# DigitalOcean App Platform spec for vsite.in — the intended configuration.
#
# NOT APPLIED, and do not apply it as-is: it does not carry the app's secret
# environment variables (Supabase, Razorpay, OpenAI, WhatsApp…), and
# `doctl apps update --spec` replaces the whole spec, secrets included. Make
# the changes below in the DigitalOcean console instead (docs/ci-cd.md, step 2).
#
# In the DO console, Source Directory MUST be set to `apps/web`.
# Without it the build runs at the repo root, finds no package.json,
# and fails.
#
# Deploys: Autodeploy is OFF (deploy_on_push: false). App Platform cannot wait
# for GitHub checks, so .github/workflows/deploy.yml starts each deployment
# itself, after CI passes and the owner approves.
name: vsite-web
region: blr

services:
  - name: web
    source_dir: apps/web
    github:
      repo: voicesitecompany-2428/voicesite.in
      branch: master
      deploy_on_push: false
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    # A new version only takes traffic once this answers; if it never does,
    # the deployment fails and the previous one keeps serving. /api/version
    # touches no database, so a Supabase hiccup cannot fail a deploy.
    health_check:
      http_path: /api/version
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    routes:
      - path: /
    # Read by GET /api/version so /add-feature live-verify can see which
    # commit is serving. Set the same var in the DO console (this file is not
    # applied automatically).
    envs:
      - key: COMMIT_SHA
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}

# The cron below was declared in vercel.json and netlify.toml. DigitalOcean
# App Platform reads NEITHER file, so on DO it has never fired. It calls the
# existing /api/cron/* route, which authenticates with Bearer CRON_SECRET via
# @/lib/platform/cronAuth.
#
# ⚠ IT IS NOT SCHEDULED. `kind: PRE_DEPLOY` runs a job once per deploy, not on
#   an interval — App Platform has no cron primitive for this. A real schedule
#   needs an external trigger: a DO Function on a timer, or an external cron
#   service POSTing with the bearer header. Tracked in AGENTS.md.
#
# 2026-09-21: the email-queue drain and plan-expiry reminder jobs were removed with the
# email notification layer. Notifications move to WhatsApp; its reminder job
# will need the same external trigger.
#
# CRON_SECRET must be set as an app-level secret. Every route fails CLOSED
# without it, so a missing value stops the job rather than opening it.
jobs:
  - name: cron-cleanup
    kind: PRE_DEPLOY
    source_dir: apps/web
    github:
      repo: voicesitecompany-2428/voicesite.in
      branch: master
      deploy_on_push: false
    run_command: >-
      curl -fsS -X POST -H "authorization: Bearer $CRON_SECRET"
      "$NEXT_PUBLIC_BASE_URL/api/cron/cleanup"
    instance_size_slug: basic-xxs
